# Isolated failure drill, not selected by the fraud-api Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api-drill
  namespace: fraud-local
  labels:
    app: fraud-api-drill
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-api-drill
  template:
    metadata:
      labels:
        app: fraud-api-drill
    spec:
      containers:
        - name: fraud-api-drill
          image: fraud-api:test
          imagePullPolicy: Never
          command:
            ["uvicorn", "tests.support.failing_api:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: 768Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
