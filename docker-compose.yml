services:
  fraud-api:
    build: .
    image: fraud-api:latest
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # No volume mounts for serving — all artifacts are baked into the image.

  # In-container parity + endpoint tests. Extends the serving image
  # (additional build context "serving") and mounts data/ read-only.
  # The dataset parquet is not baked into either image.
  #   docker compose run --rm test
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
      additional_contexts:
        serving: service:fraud-api
    image: fraud-api:test
    volumes:
      - ./data:/app/data:ro
    working_dir: /app
    command:
      - python
      - -m
      - pytest
      - tests/test_training_serving_parity.py
      - tests/test_api_endpoint.py
      - -v
