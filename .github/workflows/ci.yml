name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.0.3 numpy==2.3.5 pandas==3.0.0 scikit-learn==1.8.0 pyarrow==23.0.1

      - name: Run monitoring and fixture guards
        run: |
          python -m pytest \
            tests/test_monitoring_schema.py \
            tests/test_fixture_models.py \
            tests/test_serving_checksum_manifest.py \
            -q
